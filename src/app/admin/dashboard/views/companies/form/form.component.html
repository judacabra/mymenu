<div id="body">
    <form [formGroup]="companyForm">
        <div class="mb-3">
            <label for="name" class="form-label"> Nombre: </label>
            <input type="text" class="form-control" id="name" formControlName="name" placeholder="Ejemplo: MyMenu">
        </div>
        <div>
            <div>
                <label for="nit" class="form-label"> NIT: </label>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">#</span>
                <input id="nit" class="form-control"  formControlName="nit">
            </div>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label"> Descripción: </label>
            <textarea id="description" class="form-control" formControlName="description"
                placeholder="Ejemplo: Empresa de software..." rows="3"></textarea>
        </div>
        <div class="form-check form-switch d-flex flex-column p-0 mb-3">
            <div>
                <label for="active" class="form-label"> Activa: </label>
            </div>
            <div>
                <input class="form-check-input" id="active" type="checkbox"
                    [checked]="companyForm.get('active')!.value" (change)="changeToggleText();">
                <span class="toggle-inactive" [ngClass]="{
                    'visible' : !companyForm.get('active')?.value,
                    'invisible': companyForm.get('active')?.value
                }">
                    NO
                </span>
                <span class="toggle-active" [ngClass]="{
                    'visible' : companyForm.get('active')?.value,
                    'invisible': !companyForm.get('active')?.value
                }">
                    SI
                </span>
            </div>
        </div>
        @if(company.img || imagePreview){
        <div class="mt-3 mb-3 hovered">
            <div id="changeImgTxt">
                <h1 class="text-white"> Cambiar imagen </h1>
            </div>
            <div class="image-container" (click)="changeImg()">
                <div id="changeImgTxt">
                    <h1 class="text-white">Cambiar imagen</h1>
                </div>
                @if (company.img) {
                <img alt="{{ companyForm.get('name')!.value }}" id="{{ 'company_' + companyForm.get('id')?.value }}"
                    src="{{ company.img 
                                ? path_server + company.img 
                                : path_img + 'not-found-img.jpg' 
                            }}" class="rounded img_changing">
                } @else {
                <img src="{{ imagePreview }}" alt="description" class="rounded img_changing">
                }
            </div>
        </div>
        } @else {
        <div class="mb-3">
            <label for="img" class="form-label"> Imagen: </label>
            <input #fileInput class="form-control" type="file" id="img" (change)="verifyIMG($event)">
        </div>
        }
        <div class="d-flex justify-content-center align-items-center">
            <button type="button" class="btn btn-primary text-white" (click)="onSubmit(actioner)"> {{ actioner }}
            </button>
        </div>
    </form>
</div>
