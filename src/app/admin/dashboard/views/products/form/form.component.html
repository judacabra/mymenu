<div id="body">
    <form [formGroup]="productForm">
        <div class="mb-3">
            <label for="name" class="form-label"> Nombre: </label>
            <input type="text" class="form-control" id="name" formControlName="name" placeholder="Ejemplo: Pizza">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label"> Descripción: </label>
            <textarea id="description" class="form-control" formControlName="description"
                placeholder="Ejemplo: 2 ingredientes a elección..." rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label"> Tipo: </label>
            <select class="form-select" aria-label="type select" formControlName="id_type">
                <option [value]="0"> Seleccione un tipo </option>
                @for (type of types; track $index){
                    @if(type.name != ''){
                        <option [value]="type.id" [selected]="type.id == productForm.get('id_type')!.value"> {{ type.name }} </option>
                    }
                }
            </select>
        </div>
        <div class="form-check form-switch d-flex flex-column p-0 mb-3">
            <div>
                <label for="recommended" class="form-label"> ¿Recomendado del chef?: </label>
            </div>
            <div>
                <input class="form-check-input" id="recommended" type="checkbox"
                    [checked]="productForm.get('recommended')!.value == 'SI'" (change)="changeToggleText();">
                <span class="toggle-inactive" [ngClass]="{
                    'visible' : productForm.get('recommended')?.value == 'NO',
                    'invisible': productForm.get('recommended')?.value == 'SI'
                }">
                    NO
                </span>
                <span class="toggle-active" [ngClass]="{
                    'visible' : productForm.get('recommended')?.value == 'SI',
                    'invisible': productForm.get('recommended')?.value == 'NO'
                }">
                    SI
                </span>
            </div>
        </div>
        <div>
            <div>
                <label for="price" class="form-label"> Precio: </label>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">$</span>
                <input id="price" class="form-control" aria-label="COP, Peso colombiano" formControlName="price">
            </div>
        </div>
        <div>
            <div>
                <label for="stock" class="form-label"> Cantidad en stock: </label>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text"> Und </span>
                <input id="stock" class="form-control" aria-label="Unidades" formControlName="stock">
            </div>
        </div>
        @if(product.img || imagePreview){
            <div class="mt-3 mb-3 hovered">
                <div id="changeImgTxt">
                    <h1 class="text-white"> Cambiar imagen </h1>
                </div>
                <div class="image-container" (click)="changeImg()">
                    <div id="changeImgTxt">
                        <h1 class="text-white">Cambiar imagen</h1>
                    </div>
                    @if (product.img) {
                        <img alt="{{ productForm.get('name')!.value }}" 
                            id="{{ 'product_' + productForm.get('id')?.value }}" 
                            src="{{ product.img 
                                ? path_server + product.img 
                                : path_img + 'not-found-img.jpg' 
                            }}"
                            class="rounded img_changing"
                        >
                    } @else {
                        <img src="{{ imagePreview }}" alt="description" class="rounded img_changing">
                    }
                </div>
            </div>
        } @else {
            <div class="mb-3">
                <label for="img" class="form-label"> Imagen: </label>
                <input #fileInput class="form-control" type="file" id="img" (change)="verifyIMG($event)">
            </div>
        }
        <div class="mb-3 d-none">
            <label for="company" class="form-label"> Company: </label>
            <input type="email" class="form-control" id="company" formControlName="id_company"
                value="{{ productForm.get('id_company')?.value }}">
        </div>
        <div class="d-flex justify-content-center align-items-center">
            <button 
                type="button" 
                class="btn btn-primary text-white" 
                (click)="onSubmit(actioner)"
            > {{ actioner }} </button>
        </div>
    </form>
</div>
