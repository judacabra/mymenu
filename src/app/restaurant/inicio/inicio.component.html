<div id="contenedor">
    <div id="navbar" class="mb-5">
        <app-navbar></app-navbar>
    </div>
    <div class="container mb-5">
        @for (type of types; track $index){
            <div class="type px-3 py-3 d-flex-center mb-4 border-brown bg-white box-shadow-brown" (click)="location(type.name, type.url);" title="Ir a {{ type.name }}">
                <h3> {{ type.name }} </h3>
            </div>
        }
    </div>
</div>
