<div id="contenedor" class="d-flex flex-column">
    <div id="navbar">
        <app-navbar></app-navbar>
    </div>
    <div id="content" class="container pt-1 pb-5">
        @for (type of types; track $index) {
            <div 
                id="{{ type.url }}" 
                class="type px-3 py-3 d-flex flex-column align-items-center br-brown" 
                title="Ir a {{type.name}}"
            >
                <h1 class="mb-3 cl-brown"> {{ type.name }} </h1> 
                
                <div class="cards row mt-3 mb-5">
                    @for (product of type.products; track $index){
                        <div class="col">
                            <div class="card" data-bs-toggle="modal" [attr.data-bs-target]="'#'+product.id">
                                <img src="{{ product.img }}" class="card-img-top" alt="product">
                                <div class="card-body">
                                    <h5 class="card-title text-center mb-1"> {{ product.name }} </h5>
                                    <p class="card-text text-center mb-1"> {{ truncateText(product.description) }}</p>
                                    <p class="card-text text-center fw-bold cl-brown price">$ {{ product.price }}</p>
                                </div>
                            </div>
                        </div>

                        <!-- Update item Modal -->
                        <div class="modal fade" id="{{product.id}}" tabindex="-1" aria-hidden="true">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header br-none pb-0 d-flex justify-content-center">
                                        <h5 class="card-title"> {{ product.name }} </h5>
                                    </div>
                                    <div class="modal-body">
                                        <img src="{{ product.img }}" alt="product" class="img-on-popup mb-3">
                                        <p class="card-text text-center"> {{ product.description }}</p>
                                        <p class="card-text text-center fs-4 cl-brown">$ {{ product.price }}</p>
                                    </div>
                                </div>
                            </div>
                        </div>  
                    }
                </div>
            </div>            
        }
    </div>
    <div id="footer">
        <app-footer></app-footer>
    </div>
</div>
